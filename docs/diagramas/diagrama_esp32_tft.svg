<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de cableado ESP32 y TFT ST7789</title>
  <desc id="desc">Esquema limpio de señales SPI y alimentación para conectar una ESP32-WROOM-32 de 38 pines a una TFT ST7789 de 8 pines.</desc>
  <defs>
    <style>
      .bg{fill:#f3f6fa}.panel{fill:#fff;stroke:#d4deea;stroke-width:2}.device{fill:#f8fbff;stroke:#b7c8db;stroke-width:2}.title{font:700 30px Arial,sans-serif;fill:#12243a}.subtitle{font:16px Arial,sans-serif;fill:#52657c}.section{font:700 19px Arial,sans-serif;fill:#23364f}.deviceTitle{font:700 20px Arial,sans-serif;fill:#142238}.text{font:700 17px Arial,sans-serif;fill:#26394f}.muted{font:14px Arial,sans-serif;fill:#5c6e82}.pin{stroke:#fff;stroke-width:3}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="bg" width="1400" height="900" rx="22"/>
  <text class="title" x="46" y="56">ESP32-WROOM-32 → TFT ST7789</text>
  <text class="subtitle" x="48" y="86">Pantalla SPI de 2 pulgadas · 240 × 320 · diagrama basado en el pinout proporcionado</text>

  <rect class="panel" x="36" y="118" width="1328" height="440" rx="18"/>
  <text class="section" x="64" y="158">1. Señales SPI</text>
  <rect class="device" x="70" y="184" width="340" height="340" rx="16"/>
  <rect class="device" x="990" y="184" width="340" height="340" rx="16"/>
  <text class="deviceTitle" x="240" y="218" text-anchor="middle">ESP32 · 38 pines</text>
  <text class="deviceTitle" x="1160" y="218" text-anchor="middle">Pantalla · 8 pines</text>

  <!-- Señales en filas alineadas: no se cruzan entre sí. -->
  <g class="wire">
    <line x1="410" y1="270" x2="990" y2="270" stroke="#d97706"/>
    <line x1="410" y1="320" x2="990" y2="320" stroke="#2563eb"/>
    <line x1="410" y1="370" x2="990" y2="370" stroke="#9333ea"/>
    <line x1="410" y1="420" x2="990" y2="420" stroke="#b08a00"/>
    <line x1="410" y1="470" x2="990" y2="470" stroke="#16a34a"/>
  </g>
  <g>
    <circle class="pin" cx="410" cy="270" r="9" fill="#d97706"/><circle class="pin" cx="990" cy="270" r="9" fill="#d97706"/>
    <circle class="pin" cx="410" cy="320" r="9" fill="#2563eb"/><circle class="pin" cx="990" cy="320" r="9" fill="#2563eb"/>
    <circle class="pin" cx="410" cy="370" r="9" fill="#9333ea"/><circle class="pin" cx="990" cy="370" r="9" fill="#9333ea"/>
    <circle class="pin" cx="410" cy="420" r="9" fill="#b08a00"/><circle class="pin" cx="990" cy="420" r="9" fill="#b08a00"/>
    <circle class="pin" cx="410" cy="470" r="9" fill="#16a34a"/><circle class="pin" cx="990" cy="470" r="9" fill="#16a34a"/>
  </g>
  <g class="text">
    <text x="96" y="276">GPIO 5 · pin 29</text>
    <text x="96" y="326">GPIO 19 · pin 31</text>
    <text x="96" y="376">GPIO 22 · pin 36</text>
    <text x="96" y="426">GPIO 23 · pin 37</text>
    <text x="96" y="476">GPIO 18 · pin 30</text>
    <text x="1020" y="276">CS</text>
    <text x="1020" y="326">DC</text>
    <text x="1020" y="376">RST</text>
    <text x="1020" y="426">SDA · MOSI</text>
    <text x="1020" y="476">SCL · SCK</text>
  </g>

  <rect class="panel" x="36" y="580" width="1328" height="284" rx="18"/>
  <text class="section" x="64" y="620">2. Alimentación y protoboard</text>

  <!-- Entrada 3V3 al riel rojo y dos derivaciones a BL/VCC. -->
  <rect x="80" y="664" width="190" height="52" rx="12" fill="#fff1f2" stroke="#fecaca" stroke-width="2"/>
  <text class="text" x="175" y="697" text-anchor="middle">ESP32 · 3V3</text>
  <line class="wire" x1="270" y1="690" x2="410" y2="690" stroke="#dc2626"/>
  <rect x="410" y="650" width="340" height="100" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="438" y1="690" x2="722" y2="690" stroke="#dc2626" stroke-width="9" stroke-linecap="round"/>
  <circle cx="460" cy="690" r="6" fill="#fff"/><circle cx="500" cy="690" r="6" fill="#fff"/><circle cx="540" cy="690" r="6" fill="#fff"/><circle cx="580" cy="690" r="6" fill="#fff"/><circle cx="620" cy="690" r="6" fill="#fff"/><circle cx="660" cy="690" r="6" fill="#fff"/><circle cx="700" cy="690" r="6" fill="#fff"/>
  <text class="muted" x="580" y="674" text-anchor="middle">RIEL ROJO · +3.3 V</text>
  <path class="wire" stroke="#dc2626" d="M750 690 H835 V660 H990"/>
  <path class="wire" stroke="#dc2626" d="M835 690 V728 H990"/>
  <circle class="pin" cx="990" cy="660" r="9" fill="#dc2626"/><circle class="pin" cx="990" cy="728" r="9" fill="#dc2626"/>
  <text class="text" x="1020" y="666">BL</text>
  <text class="text" x="1020" y="734">VCC</text>

  <!-- GND directo; el riel azul es opcional si se une al GND del ESP32. -->
  <rect x="80" y="774" width="190" height="52" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text class="text" x="175" y="807" text-anchor="middle">ESP32 · GND</text>
  <line class="wire" x1="270" y1="800" x2="990" y2="800" stroke="#334155"/>
  <circle class="pin" cx="990" cy="800" r="9" fill="#334155"/>
  <text class="text" x="1020" y="806">GND de la pantalla</text>

  <text class="muted" x="64" y="846">SDA significa MOSI y SCL significa SCK en esta pantalla SPI; no son líneas I²C.</text>
</svg>
